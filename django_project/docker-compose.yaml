version: '3.8'

services:
  django_nginx_backend:
    build: .
    container_name: django_nginx_experimental
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8001
    environment:
      - DEBUG=1
      - ALLOWED_HOSTS=localhost
      - DATABASE_NAME=mydb
      - DATABASE_USER=myuser
      - DATABASE_PASSWORD=mypassword
      - DATABASE_HOST=django_nginx_db
      - DATABASE_PORT=5432
    depends_on:
      - django_nginx_db
      - nginx
    ports:
      - "8001:8001"

  django_nginx_db:
    image: postgres:latest
    container_name: django_db
    restart: always
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    container_name: django_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    # depends_on:
    #   - django_nginx_backend

volumes:
  postgres_data:
